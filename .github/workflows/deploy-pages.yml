name: deploy-github-pages

on:
  push:
    # dev 上跑测试但**不部署**——下面三个作业都卡着
    # `github.ref == 'refs/heads/main'`，所以推 dev 只验证、推 main 才上线。
    # 这正是 owner 要的语义（main = 已上线），不必再加别的开关。
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_visual:
        description: Run all 14 pages at five widths and retain preview screenshots
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint, build once, and verify rendered content
        env:
          GITHUB_PAGES_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: /AIIGovernance-docs
        run: npm run verify
      - name: Browser and accessibility smoke
        env:
          AIIG_BROWSER_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_visual) && '1' || '0' }}
          AIIG_BROWSER_CAPTURE: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_visual) && '1' || '0' }}
        run: npm run test:browser
      - name: Upload manually requested full visual matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_visual
        uses: actions/upload-artifact@v4
        with:
          name: docs-visual-matrix-${{ github.run_id }}
          path: outputs/browser-previews
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: outputs/browser-failures
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the single verified site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-domestic-mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, deploy]
    env:
      DEPLOY_HOST: 101.47.19.2
    steps:
      - uses: actions/checkout@v4
      - name: Download the same verified artifact used by GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Extract verified static site
        run: |
          mkdir out
          tar -xf artifact/artifact.tar -C out
      - name: Configure restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.AIIG_DOCS_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
      - name: Atomically deploy domestic mirror
        run: tar -C out -czf - . | ssh -i ~/.ssh/id_ed25519 aiigdocs@"$DEPLOY_HOST"
      - name: Verify GitHub Pages and domestic mirror
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run verify:dual-site
