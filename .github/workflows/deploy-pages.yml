name: deploy-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: /AIIGovernance-docs
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Upload domestic mirror artifact
        uses: actions/upload-artifact@v4
        with:
          name: domestic-mirror
          path: out
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-domestic-mirror:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_HOST: 101.47.19.2
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: domestic-mirror
          path: out
      - name: Configure restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.AIIG_DOCS_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
      - name: Atomically deploy domestic mirror
        run: tar -C out -czf - . | ssh -i ~/.ssh/id_ed25519 aiigdocs@"$DEPLOY_HOST"
